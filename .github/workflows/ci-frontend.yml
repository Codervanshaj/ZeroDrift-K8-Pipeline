name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - 'app/frontend-service/**'
      - 'helm/frontend-service/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: gitops-manifest-update
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        id: vars
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ steps.vars.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:latest

      - name: Sign image with Cosign
        uses: sigstore/cosign-installer@v3
        
      - name: Sign the container image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ steps.vars.outputs.TAG }}@${{ steps.build-frontend.outputs.digest }}

      - name: Update image tag in Helm values
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          yq e '.image.tag = strenv(TAG)' -i helm/frontend-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/frontend-service/values.yaml
          git commit -m "ci: update frontend image tag to ${{ steps.vars.outputs.TAG }}"
          
          # Pull latest changes before pushing (in case manual commits were added during pipeline execution)
          git pull --rebase origin main
          git push origin main
