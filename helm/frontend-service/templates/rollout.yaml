apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    canary:
      canaryService: {{ .Release.Name }}-canary   # routes canary traffic
      stableService: {{ .Release.Name }}-stable    # routes stable traffic
      {{- if .Values.canary.enabled }}
      steps:
        - setWeight: 10      # send 10% traffic to new version
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: {{ .Release.Name }}-success-rate-check
        - setWeight: 50      # if analysis passed: 50% traffic
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: {{ .Release.Name }}-success-rate-check
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.env.APP_VERSION | quote }}
            - name: FORCE_ERRORS
              value: {{ .Values.env.FORCE_ERRORS | quote | default "false" }}
            - name: BACKEND_URL
              value: {{ .Values.env.BACKEND_URL | quote }}
            - name: ROLLOUTS_POD_TEMPLATE_HASH
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['rollouts-pod-template-hash']
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
