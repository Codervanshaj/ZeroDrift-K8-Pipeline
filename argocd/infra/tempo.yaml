apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: zero-drift
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: ">=1.5.0"
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
