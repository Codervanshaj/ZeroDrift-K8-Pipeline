apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: zero-drift
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: ">=2.9.0"
    helm:
      values: |
        loki:
          isDefault: false
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
