apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo-error-budget
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo-error-budget.json: |
    {
      "title": "SLO Error Budget",
      "panels": [
        {
          "title": "Availability SLO Budget Remaining",
          "type": "stat",
          "targets": [
            {
              "expr": "(1 - (1 - 0.995) - (sum(increase(http_requests_total{status=~\"5..\"}[30d])) / sum(increase(http_requests_total[30d])))) * 100"
            }
          ]
        }
      ]
    }
